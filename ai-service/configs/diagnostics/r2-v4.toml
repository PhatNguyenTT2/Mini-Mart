[data]
rule_feature_schema_version = "3.0.0"
minimum_non_trap_directed_rules = 5000
minimum_distinct_organic_rule_items = 3000
minimum_val_context_rule_coverage = 0.60
minimum_training_rows_with_any_rule = 0.40
maximum_trap_anchored_rule_fraction = 0.10

[train]
objective = "sampled_softmax"
explicit_negative_ratio = 16

[eval]
k = 10
bootstrap_samples = 2000
random_seeds = 10
minimum_gauc = 0.75
random_gauc_tolerance = 0.02
cold_score_atol = 1e-6
wide_zero_atol = 1e-7
