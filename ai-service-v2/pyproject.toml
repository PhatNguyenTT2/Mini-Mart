[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "posmart-ai-service-v2"
version = "0.1.0"
description = "Reference-bound research runner for the hybrid recommender benchmark"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]
train = [
  "torch==2.2.2",
]

[project.scripts]
ai-v2 = "ai_service_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "unit: deterministic unit tests",
  "integration: tests crossing more than one module",
  "runtime: requires an admitted runtime or external artifact",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
