[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-recsys-pipeline"
version = "0.1.0"
description = "Research pipeline for a decoupled two-tower and association-rule hybrid recommender"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]
baselines = [
  "recbole==1.2.1",
]
train = [
  "torch==2.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
"pipeline/*" = ["E501", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "unit: deterministic unit tests",
  "integration: tests crossing more than one module",
  "runtime: requires an admitted runtime or external artifact",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
