name: CI Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ai-service/**'
      - 'backend/docs/chatbot/seed-product/**'
      - 'backend/services/chatbot/**'
      - 'backend/services/order/src/db/init.sql'
      - 'backend/docker-compose.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'customer/**'
      - 'ai-service/**'
      - '.github/workflows/ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (Admin)
        working-directory: ./frontend
        run: npm ci

      - name: Lint Admin
        working-directory: ./frontend
        run: npm run lint

      - name: Install dependencies (Customer)
        working-directory: ./customer
        run: npm ci

      - name: Lint Customer
        working-directory: ./customer
        run: npm run lint

      # (Optional) Add backend tests here when ready
      # - name: Test Backend
      #   working-directory: ./backend
      #   run: npm run test

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install locked development environment
        run: |
          python -m pip install uv==0.12.3
          uv sync --frozen --extra train --extra export --extra serve --extra dev

      - name: Static contracts
        run: |
          uv run ruff format --check src tests
          uv run ruff check src tests
          uv run mypy src

      - name: Unit, integration, acceptance and coverage
        run: |
          uv run pytest tests/unit -q
          uv run pytest tests/integration -q
          uv run pytest tests/acceptance -q
          uv run pytest --cov=ai_service --cov-fail-under=85 -q

      - name: Chatbot AI client and seed contracts
        working-directory: ./backend
        run: |
          npm ci --ignore-scripts
          npm test --workspace=@posmart/chatbot-service -- --runInBand tests/unit/ai.client.test.js
          node --check docs/chatbot/seed-product/benchmark-lib.js
          node --check docs/chatbot/seed-product/seed-ml-events.js
          node --check docs/chatbot/seed-product/seed-ml-benchmark.js

      - name: Build CPU-only serving image
        run: docker build -t posmart-ai-service:ci .

      - name: Docker fail-closed smoke
        run: |
          mkdir -p .smoke-model
          docker run -d --read-only --tmpfs /tmp --name ai-service-smoke \
            -v "$PWD/.smoke-model:/models/current:ro" -p 18000:8000 \
            posmart-ai-service:ci
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:18000/health/live; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18000/health/ready)" = "503"

      - name: Remove smoke container
        if: always()
        run: docker rm --force ai-service-smoke || true

  ai-service-fixed-hardware-benchmark:
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: [self-hosted, ai-benchmark]
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install uv==0.12.3
          uv sync --frozen --extra train --extra export --extra serve --extra dev
          uv run pytest tests/benchmark -q
