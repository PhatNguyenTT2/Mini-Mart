name: CI Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ai-service/**'
      - 'backend/docs/chatbot/seed-product/**'
      - 'backend/services/chatbot/**'
      - 'backend/services/order/src/db/init.sql'
      - 'backend/docker-compose.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'customer/**'
      - 'ai-service/**'
      - '.github/workflows/ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (Admin)
        working-directory: ./frontend
        run: npm ci

      - name: Lint Admin
        working-directory: ./frontend
        run: npm run lint

      - name: Install dependencies (Customer)
        working-directory: ./customer
        run: npm ci

      - name: Lint Customer
        working-directory: ./customer
        run: npm run lint

      # (Optional) Add backend tests here when ready
      # - name: Test Backend
      #   working-directory: ./backend
      #   run: npm run test

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install core (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2 "numpy<2" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Unit tests
        run: pytest -q

      - name: Chatbot AI client contract
        working-directory: ./backend
        run: |
          npm ci --ignore-scripts
          npm test --workspace=@posmart/chatbot-service -- --runInBand tests/unit/ai.client.test.js
          node --check docs/chatbot/seed-product/benchmark-lib.js
          node --check docs/chatbot/seed-product/seed-ml-events.js
          node --check docs/chatbot/seed-product/seed-ml-benchmark.js
