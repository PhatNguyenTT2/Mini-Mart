version: '3.8'

x-common-config: &common-config
  restart: always
  networks:
    - minimart-net
  env_file:
    - .env

services:
  gateway:
    <<: *common-config
    image: ghcr.io/phatnguyentt2/mini-mart/gateway:latest
    container_name: minimart-gateway
    ports:
      - "8080:80"
    mem_limit: 150m
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - auth
      - catalog
      - order
      - settings
      - supplier
      - inventory
      - payment
      - chatbot
      - statistics

  auth:
    <<: *common-config
    image: ghcr.io/phatnguyentt2/mini-mart/auth:latest
    container_name: minimart-auth
    mem_limit: 250m
    environment:
      - DATABASE_URL=${AUTH_DATABASE_URL:-$DATABASE_URL}

  catalog:
    <<: *common-config
    image: ghcr.io/phatnguyentt2/mini-mart/catalog:latest
    container_name: minimart-catalog
    mem_limit: 250m
    environment:
      - DATABASE_URL=${CATALOG_DATABASE_URL}

  order:
    <<: *common-config
    image: ghcr.io/phatnguyentt2/mini-mart/order:latest
    container_name: minimart-order
    mem_limit: 250m
    environment:
      - DATABASE_URL=${ORDER_DATABASE_URL:-$DATABASE_URL}

  settings:
    <<: *common-config
    image: ghcr.io/phatnguyentt2/mini-mart/settings:latest
    container_name: minimart-settings
    mem_limit: 200m

  supplier:
    <<: *common-config
    image: ghcr.io/phatnguyentt2/mini-mart/supplier:latest
    container_name: minimart-supplier
    mem_limit: 250m
    environment:
      - DATABASE_URL=${SUPPLIER_DATABASE_URL:-$DATABASE_URL}

  inventory:
    <<: *common-config
    image: ghcr.io/phatnguyentt2/mini-mart/inventory:latest
    container_name: minimart-inventory
    mem_limit: 250m
    environment:
      - DATABASE_URL=${INVENTORY_DATABASE_URL:-$DATABASE_URL}

  payment:
    <<: *common-config
    image: ghcr.io/phatnguyentt2/mini-mart/payment:latest
    container_name: minimart-payment
    mem_limit: 250m
    environment:
      - DATABASE_URL=${PAYMENT_DATABASE_URL:-$DATABASE_URL}
      - VNP_TMNCODE=${VNP_TMN_CODE}
      - VNP_HASHSECRET=${VNP_HASH_SECRET}

  statistics:
    <<: *common-config
    image: ghcr.io/phatnguyentt2/mini-mart/statistics:latest
    container_name: minimart-statistics
    mem_limit: 200m

  chatbot:
    <<: *common-config
    image: ghcr.io/phatnguyentt2/mini-mart/chatbot:latest
    container_name: minimart-chatbot
    mem_limit: 1.2g
    depends_on:
      ai-service:
        condition: service_healthy
    environment:
      - DATABASE_URL=${CHATBOT_DATABASE_URL:-$DATABASE_URL}
      - AI_SERVICE_URL=http://ai-service:8000

  ai-service:
    <<: *common-config
    image: ghcr.io/phatnguyentt2/mini-mart/ai-service:latest
    container_name: minimart-ai-service
    mem_limit: 1g
    environment:
      - AI_ENV=production
      - AI_PORT=8000
      - AI_MODEL_BUNDLE_PATH=/models/current
    volumes:
      - ${AI_MODEL_BUNDLE_PATH}:/models/current:ro
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  minimart-net:
    driver: bridge
